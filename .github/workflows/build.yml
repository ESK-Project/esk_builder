name: Build kernel
on:
  workflow_dispatch:
    inputs:
      target:
        description: Device
        type: choice
        default: xaga
        options: [xaga, plato]
      preset:
        description: Variant
        type: choice
        default: vnl
        options: [vnl, ksu, ksu-susfs]
      kernel_ref:
        description: Kernel branch, tag, or commit (empty uses target config)
        type: string
        default: ""
      stock_config:
        description: Stock configuration
        type: choice
        default: auto
        options: [auto, 'true', 'false']
      notify:
        description: Upload to Telegram
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        type: string
        default: ""
      preset:
        type: string
        default: vnl
      kernel_ref:
        type: string
        default: ""
      stock_config:
        type: string
        default: auto
      notify:
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: false
      TG_BOT_TOKEN:
        required: false
      TG_CHAT_ID:
        required: false

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  TERM: xterm-256color

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      PRESET: ${{ inputs.preset }}
      KERNEL_REF_INPUT: ${{ inputs.kernel_ref }}
      STOCK_CONFIG_INPUT: ${{ inputs.stock_config }}
      NOTIFY: ${{ inputs.notify }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 bc bison bsdextrautils build-essential ccache curl \
            flex git kmod libfaketime llvm patch tar xz-utils zip zstd
          uv sync --locked --no-dev

      - name: Resolve build settings
        id: settings
        run: |
          args=()

          if [[ -n "$TARGET" ]]; then
            args+=("$TARGET")
          fi

          args+=(--preset "$PRESET")
          args+=(--stock-config "$STOCK_CONFIG_INPUT")

          if [[ -n "$KERNEL_REF_INPUT" ]]; then
            args+=(--kernel-ref "$KERNEL_REF_INPUT")
          fi

          if [[ "$NOTIFY" == "true" ]]; then
            args+=(--notify)
          else
            args+=(--no-notify)
          fi

          printf '%s\0' "${args[@]}" > "$RUNNER_TEMP/esk-args"

          uv run --locked esk resolve "${args[@]}" \
            > "$RUNNER_TEMP/esk-settings.json"

          jq -r '
            "target=\(.TARGET_NAME)",
            "preset=\(.PRESET)",
            "out_dir=\(.OUT_DIR)",
            "cache_dir=\(.CCACHE_DIR)",
            "cache_enabled=\(.CCACHE_ENABLED)"
          ' "$RUNNER_TEMP/esk-settings.json" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: cache
        if: steps.settings.outputs.cache_enabled == 'true'
        uses: actions/cache/restore@v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.settings.outputs.cache_dir }}
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.settings.outputs.target }}-${{ steps.settings.outputs.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.settings.outputs.target }}-${{ steps.settings.outputs.preset }}-
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.settings.outputs.target }}-

      - name: Build
        id: build
        env:
          OUT_DIR: ${{ steps.settings.outputs.out_dir }}
        run: |
          mapfile -d '' -t args < "$RUNNER_TEMP/esk-args"
          status=0
          uv run --locked esk build "${args[@]}" || status=$?
          if [[ -f "$OUT_DIR/compiled" ]]; then
            echo 'compiled=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload packages and logs
        id: artifact
        if: ${{ !cancelled() && steps.settings.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.settings.outputs.target }}-${{ steps.settings.outputs.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.settings.outputs.out_dir }}/
          compression-level: 0
          if-no-files-found: warn

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outputs.compiled == 'true' && steps.settings.outputs.cache_enabled == 'true' }}
        uses: actions/cache/save@v6.1.0
        continue-on-error: true
        with:
          path: ${{ steps.settings.outputs.cache_dir }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build summary
        if: ${{ !cancelled() && steps.settings.outcome == 'success' }}
        env:
          BUILD_TARGET: ${{ steps.settings.outputs.target }}
          BUILD_PRESET: ${{ steps.settings.outputs.preset }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          OUT_DIR: ${{ steps.settings.outputs.out_dir }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            cat <<EOF
          ### $BUILD_TARGET / $BUILD_PRESET

          - **Build status** $BUILD_STATUS
          EOF

            if [[ -f "$OUT_DIR/build.json" ]]; then
              jq -r '
                "- **Kernel version** \(.kernel_version)",
                "- **Kernel commit** [\(.kernel_commit[:12])](\(.kernel_url)/commit/\(.kernel_commit))",
                "- **Compiler** \(.toolchain)",
                "- **Compile time** \(.compile_seconds / 60 | floor)m \(.compile_seconds % 60)s"
              ' "$OUT_DIR/build.json"
            fi

            if [[ -n "$ARTIFACT_URL" ]]; then
              printf '\n[Download build artifact](%s)\n' "$ARTIFACT_URL"
            fi

            if [[ -f "$OUT_DIR/ccache-stats.txt" ]]; then
              printf '\n%s\n\n%s\n' '#### ccache statistics' '```text'
              cat "$OUT_DIR/ccache-stats.txt"
              printf '%s\n' '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
