name: Build kernel
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target profile
        type: string
        default: xaga-6.12
      kernel_ref:
        description: Kernel ref (empty uses target profile)
        type: string
        default: ""
      modules_ref:
        description: Modules ref (empty uses target profile)
        type: string
        default: ""
      action:
        description: Build stage
        type: choice
        options: [build, configure, check]
        default: build
  workflow_call:
    inputs:
      target:
        type: string
        default: xaga-6.12
      kernel_ref:
        type: string
        default: ""
      modules_ref:
        type: string
        default: ""
      action:
        type: string
        default: build
    secrets:
      SOURCE_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/ack.yml
    with:
      target: ${{ inputs.target || 'xaga-6.12' }}
      kernel_ref: ${{ inputs.kernel_ref }}
      modules_ref: ${{ inputs.modules_ref }}
      action: ${{ inputs.action || 'build' }}
    secrets:
      SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
