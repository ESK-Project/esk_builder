name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl shellcheck shfmt
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$RUNNER_TEMP/just"
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"
          uv sync --locked

      - run: just check
      - name: Check ACK packaging
        run: uv run --locked python -m unittest discover -s tests -p test_ack_package.py
      - name: Validate target
        run: uv run --locked esk profile xaga-6.12 > /dev/null
