name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y just shellcheck shfmt ccache gcc
          uv sync --locked

      - run: just check
      - name: Validate presets
        run: |
          for preset in vnl ksu ksu-susfs; do
            uv run --locked esk build xaga --preset "$preset" --dry-run > /dev/null
          done
